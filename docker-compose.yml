services:
  db:
    image: postgres:16-alpine
    container_name: tempo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempo}
      POSTGRES_DB: ${POSTGRES_DB:-tempo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempo} -d ${POSTGRES_DB:-tempo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: tempo_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tempo}:${POSTGRES_PASSWORD:-tempo}@db:5432/${POSTGRES_DB:-tempo}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./assets:/app/assets
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.main

volumes:
  postgres_data:
